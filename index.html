<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#2a1436" />
  <title>Princess Academy Online</title>
  <link
    rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>"
  />
  <script type="module" crossorigin src="./assets/index-DdQYT3cP.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BCB__-jo.css">
</head>
<body>
  <!-- The 3D game renders here -->
  <canvas id="gameCanvas" touch-action="none"></canvas>

  <!-- ===================== LOADING ===================== -->
  <div id="loadingScreen" class="screen-overlay">
    <div class="loader-crown">👑</div>
    <h1 class="loader-title" data-i18n="app.title">Princess Academy Online</h1>
    <div class="loader-bar"><div id="loaderFill" class="loader-fill"></div></div>
    <p id="loaderStatus" class="loader-status" data-i18n="loading.booting">Starting the magic…</p>
  </div>

  <!-- ===================== AUTH (login / register) ===================== -->
  <div id="authScreen" class="screen-overlay hidden">
    <div class="panel">
      <div class="lang-switch" id="authLangSwitch">
        <button data-lang="en" class="lang-btn">EN</button>
        <button data-lang="ar" class="lang-btn">ع</button>
      </div>
      <div class="brand"><span class="brand-crown">👑</span><span data-i18n="app.title">Princess Academy Online</span></div>

      <div class="tabs">
        <button id="tabLogin" class="tab active" data-i18n="auth.login">Log In</button>
        <button id="tabRegister" class="tab" data-i18n="auth.register">Register</button>
      </div>

      <form id="authForm" autocomplete="on">
        <label class="field" id="fieldUsername">
          <span data-i18n="auth.username">Username</span>
          <input name="username" type="text" autocomplete="username" required minlength="3" maxlength="20" />
        </label>
        <label class="field">
          <span data-i18n="auth.email">Email</span>
          <input name="email" type="email" autocomplete="email" required />
        </label>
        <label class="field">
          <span data-i18n="auth.password">Password</span>
          <input name="password" type="password" autocomplete="current-password" required minlength="8" />
        </label>
        <p id="authError" class="form-error" role="alert"></p>
        <button type="submit" id="authSubmit" class="btn primary" data-i18n="auth.login">Log In</button>
      </form>

      <button id="guestBtn" class="btn ghost" data-i18n="auth.guest">Play as Guest</button>
    </div>
  </div>

  <!-- ===================== IN-GAME HUD ===================== -->
  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="hud-player">
        <span class="hud-avatar">👑</span>
        <div>
          <div id="hudName" class="hud-name">Princess</div>
          <div class="hud-level">
            <span data-i18n="hud.level">Level</span> <b id="hudLevel">1</b>
          </div>
        </div>
      </div>
      <div class="hud-currencies">
        <div class="currency" title="Coins"><span class="c-icon">🪙</span><b id="hudCoins">0</b></div>
        <div class="currency" title="Gems"><span class="c-icon">💎</span><b id="hudGems">0</b></div>
      </div>
      <button id="wardrobeBtn" class="icon-btn" aria-label="Wardrobe">👗</button>
      <button id="emoteBtn" class="icon-btn" aria-label="Emotes">😊</button>
      <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙️</button>
    </div>

    <!-- Emote quick bar -->
    <div id="emoteBar" class="emote-bar hidden"></div>

    <div class="hud-xp">
      <div class="hud-xp-fill" id="hudXpFill"></div>
      <span class="hud-xp-label"><span data-i18n="hud.xp">XP</span> <span id="hudXpText">0 / 100</span></span>
    </div>

    <!-- Quest tracker -->
    <div class="quest" id="questTracker">
      <span class="quest-icon">💎</span>
      <span data-i18n="quest.collect">Collect the gems</span>
      <b id="questText">0/0</b>
    </div>

    <!-- Floating reward popups appear here -->
    <div id="rewardLayer" class="reward-layer"></div>

    <!-- Chat -->
    <div id="chatBox" class="chat">
      <div id="chatLog" class="chat-log"></div>
      <form id="chatForm" class="chat-input">
        <input id="chatInput" type="text" maxlength="140" data-i18n-ph="chat.placeholder" placeholder="Say something…" />
        <button type="submit" class="btn small" data-i18n="chat.send">Send</button>
      </form>
    </div>

    <!-- Mobile touch controls -->
    <div id="touchJoystick" class="joystick hidden">
      <div id="joystickKnob" class="joystick-knob"></div>
    </div>
    <button id="jumpBtn" class="action-btn hidden" data-i18n="controls.jump">Jump</button>

    <!-- House: enter prompt (city) + controls bar (inside) -->
    <button id="enterHouseBtn" class="prompt-btn hidden">🏠 <span data-i18n="house.enter">Enter House</span></button>
    <div id="houseBar" class="house-bar hidden">
      <button id="decorToggle" class="btn small" data-i18n="house.decorate">Decorate</button>
      <div id="furnPalette" class="furn-palette hidden"></div>
      <button id="removeToggle" class="btn small hidden" data-i18n="house.remove">Remove</button>
      <button id="exitHouseBtn" class="btn small" data-i18n="house.exit">Exit</button>
    </div>
  </div>

  <!-- ===================== WARDROBE ===================== -->
  <div id="wardrobeScreen" class="screen-overlay hidden">
    <div class="panel wardrobe-panel">
      <h2 data-i18n="wardrobe.title">Wardrobe</h2>
      <div class="wardrobe-tabs" id="wardrobeTabs"></div>
      <div class="wardrobe-grid" id="wardrobeGrid"></div>
      <div class="wardrobe-wallet">
        <span>🪙 <b id="wardrobeCoins">0</b></span>
        <span>💎 <b id="wardrobeGems">0</b></span>
      </div>
      <button id="closeWardrobe" class="btn primary" data-i18n="wardrobe.close">Close</button>
    </div>
  </div>

  <!-- ===================== SETTINGS ===================== -->
  <div id="settingsScreen" class="screen-overlay hidden">
    <div class="panel">
      <h2 data-i18n="settings.title">Settings</h2>
      <div class="setting-row">
        <span data-i18n="settings.language">Language</span>
        <div class="lang-switch" id="settingsLangSwitch">
          <button data-lang="en" class="lang-btn" data-i18n="settings.english">English</button>
          <button data-lang="ar" class="lang-btn" data-i18n="settings.arabic">العربية</button>
        </div>
      </div>
      <div class="setting-row">
        <span data-i18n="settings.sound">Sound</span>
        <button id="soundToggle" class="btn small" data-i18n="settings.sound.on">On</button>
      </div>
      <button id="closeSettings" class="btn primary" data-i18n="settings.close">Close</button>
      <button id="logoutBtn" class="btn ghost" data-i18n="settings.logout">Log Out</button>
    </div>
  </div>

</body>
</html>
